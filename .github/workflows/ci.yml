name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit + integration tests (testcontainers spins up Postgres)
        run: bun run test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/unused
          JWT_ACCESS_SECRET: ci-access-secret-min-32-chars-long!!!
          JWT_REFRESH_SECRET: ci-refresh-secret-min-32-chars-long!!!
          PG_TEST: '1'

      - name: Build
        run: bun run build

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api_dev
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
        # MinIO serves the same container's data dir; need to override entrypoint
        command: server /data

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/api_dev
          JWT_ACCESS_SECRET: ci-access-secret-min-32-chars-long!!!
          JWT_REFRESH_SECRET: ci-refresh-secret-min-32-chars-long!!!
          S3_BUCKET: ci-bucket
          S3_ACCESS_KEY_ID: ci-access-key
          S3_SECRET_ACCESS_KEY: ci-secret-key
          S3_ENDPOINT: http://localhost:9000

      - name: Seed database
        run: bun run db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/api_dev
          JWT_ACCESS_SECRET: ci-access-secret-min-32-chars-long!!!
          JWT_REFRESH_SECRET: ci-refresh-secret-min-32-chars-long!!!
          S3_BUCKET: ci-bucket
          S3_ACCESS_KEY_ID: ci-access-key
          S3_SECRET_ACCESS_KEY: ci-secret-key
          S3_ENDPOINT: http://localhost:9000

      - name: Build
        run: bun run build

      - name: Create MinIO bucket
        # File-upload e2e tests PUT objects; provision the bucket the app is
        # configured with (S3_BUCKET=ci-bucket) before starting the server.
        run: |
          curl -sfL https://dl.min.io/client/mc/release/linux-amd64/mc -o /tmp/mc
          chmod +x /tmp/mc
          /tmp/mc alias set local http://localhost:9000 minioadmin minioadmin
          /tmp/mc mb --ignore-existing local/ci-bucket

      - name: Start server
        run: |
          bun run start &
          # Wait for readiness
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ready > /dev/null; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done
        env:
          NODE_ENV: production
          PORT: 3000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/api_dev
          JWT_ACCESS_SECRET: ci-access-secret-min-32-chars-long!!!
          JWT_REFRESH_SECRET: ci-refresh-secret-min-32-chars-long!!!
          S3_BUCKET: ci-bucket
          S3_ACCESS_KEY_ID: ci-access-key
          S3_SECRET_ACCESS_KEY: ci-secret-key
          S3_ENDPOINT: http://localhost:9000

      - name: Run Bruno e2e tests
        # Run through `bun run` so node_modules/.bin is on PATH — a bare `bru`
        # command would not resolve (bun install does not add .bin to PATH).
        run: bun run bruno:run
