name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests (testcontainers spins up Postgres)
        run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/unused
          JWT_ACCESS_SECRET: ci-access-secret-min-32-chars-long!!!
          JWT_REFRESH_SECRET: ci-refresh-secret-min-32-chars-long!!!

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api_dev
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/api_dev

      - name: Seed database
        run: pnpm db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/api_dev

      - name: Start server
        run: |
          pnpm start &
          # Wait for readiness
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ready > /dev/null; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done
        env:
          NODE_ENV: production
          PORT: 3000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/api_dev
          JWT_ACCESS_SECRET: ci-access-secret-min-32-chars-long!!!
          JWT_REFRESH_SECRET: ci-refresh-secret-min-32-chars-long!!!

      - name: Run Bruno e2e tests
        run: cd bruno && bru run --env local