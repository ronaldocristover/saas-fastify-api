services:
  postgres:
    image: postgres:17-alpine
    container_name: fastify-api-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_dev
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d api_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: